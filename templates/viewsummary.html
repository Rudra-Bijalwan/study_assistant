{% extends "layout.html" %}

{% block title %}
{{ summary.title }}
{% endblock %}

{% block main %}
<h1>{{ summary.title }}</h1>

<div class="card" style="width: 600px;">
    <div class="card-body">
        <p style="white-space: pre-line;">{{ summary.content }}</p>
    </div>
</div>

<details class="mt-3" style="width: 600px;">
    <summary>Show original text</summary>
    <p style="white-space: pre-line;">{{ summary.source_text }}</p>
</details>

<div class="text-center mt-3">
    <a href="{{ url_for('summarizetext', subject_id=subject_id) }}">
        <button type="button" class="btn btn-secondary">Back</button>
    </a>
    <form method="post" class="d-inline"
          action="{{ url_for('deletesummary', subject_id=subject_id, summary_id=summary.id) }}">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
{% endblock %}
