{% extends "layout.html" %}

{% block title %}
Subjects
{% endblock %}

{% block main %}
<div class="text-center">
    {% for subject in subjects%}
        <a href="{{ url_for('subject', subject_id=subject.id) }}">
            <button type="button" class="btn btn-primary btn-lg">{{ subject.name }}</button>
        </a>
    {%endfor%}
</div>
{% endblock %}
