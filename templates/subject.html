{% extends "layout.html" %}

{% block title %}
{{ subject.name }}
{% endblock %}

{% block main %}
<div class="text-center">
    <a href="{{ url_for('todolist', subject_id=subject.id) }}">
        <button type="button" class="btn btn-primary btn-lg">To-Do List</button>
    </a>
    <a href="{{ url_for('summarizetext', subject_id=subject.id) }}">
        <button type="button" class="btn btn-primary btn-lg">Summarize Text</button>
    </a>
    <form method="post" action="{{ url_for('logout') }}" class="d-inline">
        <button type="submit" class="btn btn-primary">Logout</button>
    </form>
    <form method="post" class="d-inline"
        action="{{ url_for('deletesubject', subject_id=subject.id) }}"
        onsubmit="return confirm('Delete {{ subject.name }} and all its tasks and summaries? This cannot be undone.');">
        <button type="submit" class="btn btn-danger">Delete Subject</button>
    </form>
</div>
{% endblock %}
