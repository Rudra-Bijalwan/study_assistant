<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Study Desk{% endblock %}</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{{ url_for('home') }}">Study Desk</a>
    {% if current_user.is_authenticated %}
    <div>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('subjects') }}">My Subjects</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('newsubject') }}">New Subject</a>
        <a class="btn btn-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
    </div>
    {% endif %}
</nav>

<main class="app-main">
    {% block main %}
    {% endblock %}
</main>

<footer class="text-center text-muted py-3">
    <p class="mb-0">&copy; 2026 Study Desk</p>
</footer>
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
