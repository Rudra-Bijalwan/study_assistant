{% extends "layout.html" %}

{% block title %}
To-Do List
{% endblock %}

{% block main %}
<div class="text-center">
    <a href="{{ url_for('settasks', subject_id=subject_id) }}">
        <button type="button" class="btn btn-primary btn-lg">Set today's tasks</button>
    </a>
</div>

<div class="text-center">
    <a href="{{ url_for('viewtasks', subject_id=subject_id) }}">
        <button type="button" class="btn btn-primary btn-lg">Show today's tasks</button>
    </a>
</div>
{% endblock %}
